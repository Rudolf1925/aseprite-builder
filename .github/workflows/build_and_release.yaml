name: Build and release Aseprite

on:
  push:
    branches:
      - main
    paths:
      - BuildLog.md
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  fetch-aseprite-info:
    name: Fetch latest Aseprite release
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.aseprite-info.outputs.release-tag }}
    steps:
      - name: Get latest Aseprite source release
        id: aseprite-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/aseprite/aseprite/releases \
            --jq 'map(select(.prerelease == false)) | .[0].tag_name')
          test -n "$tag"
          echo "release-tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: fetch-aseprite-info
    permissions:
      contents: write
    outputs:
      release-tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ needs.fetch-aseprite-info.outputs.release-tag }}'
          gh release view "$tag" --repo '${{ github.repository }}' >/dev/null 2>&1 ||
            gh release create "$tag" \
              --repo '${{ github.repository }}' \
              --title "Aseprite $tag" \
              --notes "Aseprite $tag"

  build-aseprite:
    name: Build Aseprite
    needs: create-release
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    steps:
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential cmake ninja-build clang lld \
            libc++-dev libc++abi-dev libssl-dev libjpeg-dev libpng-dev \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libarchive-dev libarchive-tools libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev \
            libgtk-3-dev libzstd-dev libbsd-dev liblzma-dev

      - uses: actions/checkout@v4

      - name: Clone Aseprite
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            --branch '${{ needs.create-release.outputs.release-tag }}' \
            https://github.com/aseprite/aseprite aseprite

      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            curl -L --fail --retry 3 \
              -o Skia.zip \
              https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
            7z x Skia.zip -oskia
          else
            curl -L --fail --retry 3 \
              -o Skia.zip \
              https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
            unzip -q Skia.zip -d skia
          fi

      - uses: aseprite/get-ninja@main

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Generate Makefiles
        shell: bash
        working-directory: aseprite
        run: |
          set -euo pipefail
          EXTRA_ARGS=()

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export CC=clang
            export CXX=clang++
            EXTRA_ARGS+=(
              -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld"
              -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld"
              -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld"
            )
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=ON \
            -DENABLE_CCACHE=OFF \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$(pwd)/skia" \
            -DSKIA_LIBRARY_DIR="$(pwd)/skia/out/Release-x64" \
            "${EXTRA_ARGS[@]}"

      - name: Compile
        shell: bash
        working-directory: aseprite
        run: cmake --build build --target aseprite --parallel 2

      - name: Verify build output
        shell: bash
        run: |
          set -e
          cd aseprite/build/bin
          ls -la
          test -d data
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f aseprite.exe
          else
            test -f aseprite
          fi

      - name: Prepare portable build
        shell: bash
        working-directory: aseprite/build/bin
        run: |
          set -e
          printf '# Portable Aseprite build\n' > aseprite.ini
          rm -rf .git CMakeFiles

      - name: Create archive
        shell: bash
        working-directory: aseprite/build/bin
        run: |
          set -e
          platform=Linux
          [[ "${{ runner.os }}" == "Windows" ]] && platform=Windows
          7z a -tzip "Aseprite-${{ needs.create-release.outputs.release-tag }}-${platform}.zip" *
          echo "platform=$platform" >> "$GITHUB_ENV"

      - name: Upload archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ needs.create-release.outputs.release-tag }}'
          gh release upload "$tag" \
            "aseprite/build/bin/Aseprite-${tag}-${platform}.zip" \
            --repo '${{ github.repository }}' --clobber
